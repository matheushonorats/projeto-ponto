<style>
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }

:root {
  --ink: #18201d;
  --muted: #69736f;
  --subtle: #8d9793;
  --line: #dde3e0;
  --line-strong: #cbd4d0;
  --surface: #ffffff;
  --canvas: #f4f6f5;
  --canvas-warm: #eff2f0;
  --brand: #285f4d;
  --brand-strong: #1e4b3c;
  --brand-soft: #e6efeb;
  --danger: #a63d40;
  --danger-soft: #f8eaea;
  --warning: #94611c;
  --warning-soft: #f8f0e1;
  --success: #277354;
  --success-soft: #e7f2ed;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-float: 0 18px 50px rgba(23, 35, 30, .12);
  --focus: 0 0 0 3px rgba(40, 95, 77, .16);
}

html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh;
  background: var(--canvas);
  color: var(--ink);
  font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
  line-height: 1.5;
  text-rendering: optimizeLegibility;
}
button, input, select { font: inherit; }
button { color: inherit; }
.view { min-height: 100vh; }
.hidden { display: none !important; }

/* Authentication */
.auth-bg {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 40px 20px;
  background:
    linear-gradient(90deg, rgba(40,95,77,.055) 1px, transparent 1px),
    linear-gradient(rgba(40,95,77,.055) 1px, transparent 1px),
    #edf1ef;
  background-size: 32px 32px;
}
.auth-card {
  width: min(100%, 420px);
  padding: 36px;
  background: rgba(255,255,255,.96);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-float);
}
.auth-logo { margin-bottom: 30px; }
.logo-mark, .topbar-icon {
  display: inline-grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 9px;
  background: var(--brand);
  color: #fff;
  font-size: 0;
  font-weight: 700;
}
.logo-mark::after, .topbar-icon::after { content: "P"; font-size: 17px; letter-spacing: -.04em; }
.auth-logo h1 { margin-top: 22px; font-size: 1.55rem; line-height: 1.2; letter-spacing: -.025em; }
.auth-logo p { margin-top: 7px; color: var(--muted); font-size: .91rem; }
.auth-form { display: grid; gap: 17px; }
.app-version { margin-top: 22px; color: var(--subtle); font-size: .75rem; text-align: center; }

/* Controls */
.form-group, .fg { display: grid; gap: 7px; }
.form-group label, .fg label { color: #3e4844; font-size: .79rem; font-weight: 650; }
.field-hint, .map-hint { color: var(--muted); font-size: .79rem; }
input[type="text"], input[type="email"], input[type="password"],
input[type="number"], input[type="date"], select, .form-ctrl {
  width: 100%;
  min-height: 43px;
  padding: 9px 12px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
input::placeholder { color: #9ba4a0; }
input:focus, select:focus, .form-ctrl:focus { border-color: var(--brand); box-shadow: var(--focus); }
input[readonly] { background: var(--canvas); color: var(--muted); }
.form-row { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 44px; }
.pw-toggle {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; border: 0; border-radius: 7px;
  background: transparent; color: var(--muted); cursor: pointer; font-size: 0;
}
.pw-toggle::after { content: "Ver"; font-size: .71rem; font-weight: 650; }
.pw-toggle:hover { background: var(--canvas); color: var(--ink); }

.btn {
  min-height: 40px;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 14px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  font-size: .86rem;
  font-weight: 650;
  transition: background .15s, border-color .15s, transform .08s;
}
.btn:focus-visible, .icon-btn:focus-visible, .nav-btn:focus-visible, .punch-btn:focus-visible { outline: none; box-shadow: var(--focus); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .48; cursor: not-allowed; }
.btn.primary { background: var(--brand); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--brand-strong); }
.btn.secondary { background: var(--surface); border-color: var(--line-strong); }
.btn.secondary:hover:not(:disabled), .btn.ghost:hover:not(:disabled) { background: var(--canvas); }
.btn.ghost { color: var(--muted); }
.btn.block { width: 100%; }
.btn.sm { min-height: 34px; padding: 6px 10px; font-size: .79rem; }
.btn-spin { letter-spacing: 2px; animation: pulse 1s infinite; }
.link-btn { padding: 0; border: 0; background: none; color: var(--brand); cursor: pointer; font-size: .8rem; font-weight: 650; }
.link-btn:hover { text-decoration: underline; }
@keyframes pulse { 50% { opacity: .35; } }

.msg, .punch-feedback { padding: 10px 12px; border-radius: 8px; border: 1px solid; font-size: .84rem; }
.msg.error, .punch-feedback.error { color: var(--danger); background: var(--danger-soft); border-color: #eccaca; }
.msg.success, .punch-feedback.success { color: var(--success); background: var(--success-soft); border-color: #c5dfd3; }
.punch-feedback.loading { color: var(--muted); background: var(--canvas); border-color: var(--line); }

/* Header */
.topbar {
  height: 64px;
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  background: rgba(255,255,255,.94);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(12px);
}
.topbar-left, .topbar-right { display: flex; align-items: center; gap: 11px; }
.topbar-icon { width: 34px; height: 34px; border-radius: 8px; }
.topbar-icon::after { font-size: 15px; }
.topbar-title { font-size: .91rem; font-weight: 700; line-height: 1.2; }
.topbar-sub { margin-top: 2px; color: var(--muted); font-size: .73rem; }
.icon-btn {
  width: 36px; height: 36px; display: grid; place-items: center;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--muted); cursor: pointer;
}
.icon-btn:hover { background: var(--canvas); color: var(--ink); }

/* Employee workspace */
.app-body { width: min(100%, 560px); margin: 0 auto; padding: 30px 20px 52px; display: grid; gap: 16px; }
.clock-card {
  padding: 25px 24px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
}
.clock-time { font-size: clamp(2.5rem, 10vw, 3.65rem); font-weight: 650; line-height: 1; letter-spacing: -.055em; font-variant-numeric: tabular-nums; }
.clock-date { margin-top: 10px; color: var(--muted); font-size: .84rem; text-transform: capitalize; }
.gps-bar { display: flex; align-items: center; gap: 9px; min-height: 46px; padding: 10px 13px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); font-size: .82rem; }
.gps-dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--subtle); }
.gps-dot.ok { background: var(--success); }
.gps-dot.error { background: var(--danger); }
.gps-dot.loading { background: var(--warning); animation: pulse 1.2s infinite; }
.gps-acc { margin-left: auto; color: var(--subtle); font-size: .72rem; white-space: nowrap; }
.punch-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
.punch-btn {
  min-height: 92px; display: grid; place-items: center; align-content: center; gap: 7px;
  border: 1px solid var(--line-strong); border-radius: var(--radius);
  background: var(--surface); color: var(--muted); cursor: pointer;
  font-size: .78rem; font-weight: 650; transition: border-color .15s, background .15s, transform .08s;
}
.punch-btn:not(:disabled):hover { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-strong); }
.punch-btn:not(:disabled):active { transform: translateY(1px); }
.punch-btn:disabled { opacity: .42; cursor: not-allowed; }
.punch-ico { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 50%; background: var(--canvas-warm); color: var(--brand); font-size: .7rem; font-weight: 750; }
.punch-feedback { text-align: center; font-weight: 600; white-space: pre-line; }
.card, .filter-card, .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.card { padding: 18px; }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; }
.card-title { font-size: .91rem; font-weight: 700; }
.record-list { display: grid; }
.record-item { min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 2px; border-top: 1px solid var(--line); }
.record-item:first-child { border-top: 0; }
.record-type { color: var(--ink); font-size: .83rem; font-weight: 650; }
.record-meta, .record-time { color: var(--muted); font-size: .75rem; }
.record-meta { margin-top: 2px; }
.record-time { white-space: nowrap; font-variant-numeric: tabular-nums; }
.empty { padding: 20px 8px; color: var(--muted); text-align: center; font-size: .82rem; }

/* Admin */
.admin-wrap { min-height: calc(100vh - 64px); display: grid; grid-template-columns: 220px minmax(0,1fr); }
.sidebar { padding: 22px 14px; background: var(--surface); border-right: 1px solid var(--line); }
.nav-btn { width: 100%; min-height: 40px; margin-bottom: 4px; padding: 8px 11px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; text-align: left; font-size: .82rem; font-weight: 600; white-space: nowrap; }
.nav-btn:hover { background: var(--canvas); color: var(--ink); }
.nav-btn.active { background: var(--brand-soft); color: var(--brand-strong); }
.admin-main { min-width: 0; padding: 34px clamp(20px, 4vw, 52px) 60px; overflow-x: auto; }
.sec { width: min(100%, 1040px); }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.sec-title { margin-bottom: 22px; font-size: 1.35rem; font-weight: 680; letter-spacing: -.025em; }
.sec-head .sec-title { margin-bottom: 0; }
.stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
.stat { min-height: 126px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
.stat-val { color: var(--ink); font-size: 2rem; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums; }
.stat-lbl { color: var(--muted); font-size: .77rem; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.dtable { width: 100%; border-collapse: collapse; }
.dtable th { padding: 11px 14px; background: #f8f9f8; color: var(--muted); text-align: left; font-size: .7rem; font-weight: 700; letter-spacing: .045em; text-transform: uppercase; white-space: nowrap; }
.dtable td { padding: 13px 14px; border-top: 1px solid var(--line); font-size: .81rem; vertical-align: middle; }
.dtable tbody tr:hover { background: #fafbfa; }
.badge { display: inline-flex; align-items: center; min-height: 24px; padding: 3px 8px; border-radius: 999px; font-size: .69rem; font-weight: 700; }
.bg-green, .bg-entrada { background: var(--success-soft); color: var(--success); }
.bg-red, .bg-saída { background: var(--danger-soft); color: var(--danger); }
.bg-blue, .bg-retorno { background: var(--brand-soft); color: var(--brand); }
.bg-gray { background: #edf0ef; color: var(--muted); }
.bg-pausa { background: var(--warning-soft); color: var(--warning); }
.act-row { display: flex; gap: 5px; flex-wrap: wrap; }
.filter-card { padding: 16px; margin-bottom: 14px; }
.filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.filter-row.wrap { align-items: flex-end; }
.filter-row > span { color: var(--muted); font-size: .78rem; }
.fg { min-width: 130px; flex: 1; }
.settings-card { max-width: 560px; display: grid; gap: 22px; }
.chip-grid { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 4px; }
.chip-item { display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 8px; cursor: pointer; font-size: .8rem; }
.chip-item:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-strong); }
.chip-item input { accent-color: var(--brand); }

/* Modal and notifications */
.modal { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: 20px; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(17, 24, 21, .48); backdrop-filter: blur(2px); }
.modal-sheet { position: relative; width: min(100%, 540px); max-height: calc(100vh - 40px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-float); }
.modal-sheet.wide { width: min(100%, 720px); }
.modal-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 17px 20px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: .94rem; font-weight: 700; }
.modal-x { width: 32px; height: 32px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; font-size: 1.25rem; }
.modal-x:hover { background: var(--canvas); }
.modal-body { padding: 20px; display: grid; gap: 18px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding-top: 16px; border-top: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 500; transform: translateX(-50%); padding: 10px 15px; border-radius: 8px; background: #202a26; color: #fff; box-shadow: var(--shadow-float); font-size: .81rem; }

@media (max-width: 820px) {
  .stats-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .admin-wrap { display: block; }
  .sidebar { position: sticky; top: 64px; z-index: 90; display: flex; gap: 5px; padding: 8px 12px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .nav-btn { width: auto; margin: 0; }
  .admin-main { padding-top: 26px; }
}
@media (max-width: 560px) {
  .auth-card { padding: 28px 22px; }
  .topbar { padding: 0 15px; }
  .app-body { padding: 20px 14px 40px; }
  .punch-grid { grid-template-columns: repeat(2, 1fr); }
  .punch-btn { min-height: 82px; }
  .form-row { grid-template-columns: 1fr; }
  .modal { align-items: end; padding: 0; }
  .modal-sheet, .modal-sheet.wide { max-height: 92vh; border-radius: 16px 16px 0 0; border-bottom: 0; }
  .stats-grid { gap: 9px; }
  .stat { min-height: 110px; padding: 16px; }
  .sec-head { align-items: flex-start; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; } }
</style>
