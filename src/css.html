<style>
/* ══════════════════════════════════════════════════
   Projeto Ponto — CSS
   Mobile-first, premium design
══════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary:       #0ea5e9;
  --primary-dark:  #0284c7;
  --primary-light: #e0f2fe;
  --success:       #10b981;
  --warning:       #f59e0b;
  --danger:        #ef4444;
  --text:          #0f172a;
  --text-muted:    #64748b;
  --border:        #e2e8f0;
  --bg:            #f1f5f9;
  --card:          #ffffff;
  --topbar:        #0f172a;
  --topbar-admin:  #1e3a5f;
  --r:             12px;
  --r-sm:          8px;
  --shadow:        0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md:     0 4px 12px rgba(0,0,0,.1);
  --shadow-lg:     0 10px 25px rgba(0,0,0,.12);
}

html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
       background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }

/* ── Views ──────────────────────────────────── */
.view  { min-height: 100vh; }
.hidden { display: none !important; }

/* ── Auth (login / setup) ───────────────────── */
.auth-bg {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(145deg, #0f172a 0%, #1e3a5f 60%, #0f172a 100%);
  padding: 1rem;
}
.auth-card {
  width: 100%; max-width: 400px;
  background: var(--card); border-radius: var(--r);
  padding: 2.5rem 2rem; box-shadow: var(--shadow-lg);
}
.auth-logo { text-align: center; margin-bottom: 2rem; }
.logo-mark { font-size: 3rem; line-height: 1; }
.auth-logo h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -.03em; margin-top: .375rem; }
.auth-logo p  { font-size: .875rem; color: var(--text-muted); margin-top: .25rem; }

.auth-form { display: flex; flex-direction: column; gap: 1rem; }
.app-version { text-align:center; font-size:.75rem; color:var(--text-muted); margin-top:1.25rem; }

/* ── Form controls ──────────────────────────── */
.form-group { display: flex; flex-direction: column; gap: .325rem; }
.form-group label { font-size: .8125rem; font-weight: 600; color: var(--text); }
.field-hint { font-size: .8rem; color: var(--text-muted); margin-top: .125rem; }

input[type="text"], input[type="email"], input[type="password"],
input[type="number"], input[type="date"], select, .form-ctrl {
  width: 100%; padding: .625rem .875rem;
  border: 1.5px solid var(--border); border-radius: var(--r-sm);
  font-size: .9375rem; font-family: inherit; color: var(--text);
  background: var(--card); transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus, .form-ctrl:focus {
  outline: none; border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(14,165,233,.15);
}
input[readonly] { background: var(--bg); cursor: default; }

.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 2.75rem; }
.pw-toggle {
  position: absolute; right: .625rem; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; font-size: 1rem; opacity: .55;
  transition: opacity .15s;
}
.pw-toggle:hover { opacity: 1; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
@media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }

/* ── Buttons ─────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  padding: .625rem 1.125rem; border-radius: var(--r-sm); border: none; cursor: pointer;
  font-size: .9375rem; font-weight: 600; font-family: inherit; text-decoration: none;
  transition: background .15s, box-shadow .15s, transform .1s, opacity .15s;
}
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--primary); color: #fff; box-shadow: 0 2px 6px rgba(14,165,233,.3); }
.btn.primary:hover:not(:disabled) { background: var(--primary-dark); box-shadow: 0 4px 10px rgba(14,165,233,.35); }
.btn.secondary { background: #e2e8f0; color: var(--text); }
.btn.secondary:hover:not(:disabled) { background: #cbd5e1; }
.btn.ghost { background: transparent; color: var(--text-muted); }
.btn.ghost:hover:not(:disabled) { background: var(--border); }
.btn.block { width: 100%; }
.btn.sm { padding: .4rem .875rem; font-size: .875rem; }

.btn-label { }
.btn-spin { animation: blink 1s infinite; letter-spacing: .1em; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

.icon-btn {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 8px; border: none; cursor: pointer;
  background: rgba(255,255,255,.08); color: #e2e8f0;
  transition: background .15s; font-size: 1rem;
}
.icon-btn:hover { background: rgba(255,255,255,.18); }
.link-btn { background: none; border: none; cursor: pointer; font-size: .8125rem;
             color: var(--primary); font-weight: 500; font-family: inherit; }
.link-btn:hover { text-decoration: underline; }

/* ── Messages ───────────────────────────────── */
.msg { padding: .75rem 1rem; border-radius: var(--r-sm); font-size: .875rem; }
.msg.error   { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
.msg.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }

/* ── Topbar ──────────────────────────────────── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: .75rem 1rem; background: var(--topbar); color: #f1f5f9;
  position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.admin-bar { background: var(--topbar-admin); }
.topbar-left  { display: flex; align-items: center; gap: .75rem; }
.topbar-right { display: flex; align-items: center; gap: .5rem; }
.topbar-icon  { font-size: 1.5rem; }
.topbar-title { font-size: .9375rem; font-weight: 700; line-height: 1.2; }
.topbar-sub   { font-size: .75rem; color: #94a3b8; }

/* ══ EMPLOYEE VIEW ══════════════════════════════ */
.app-body {
  max-width: 480px; margin: 0 auto;
  padding: 1rem; display: flex; flex-direction: column; gap: 1rem;
}

/* Clock */
.clock-card {
  background: var(--topbar); color: #fff;
  border-radius: var(--r); padding: 1.5rem; text-align: center;
}
.clock-time { font-size: 3rem; font-weight: 800; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.clock-date { color: #94a3b8; margin-top: .375rem; font-size: .875rem; }

/* GPS bar */
.gps-bar {
  display: flex; align-items: center; gap: .5rem;
  background: var(--card); border-radius: var(--r);
  padding: .875rem 1rem; box-shadow: var(--shadow);
  border: 1.5px solid var(--border); font-size: .9rem; font-weight: 500;
}
.gps-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  background: #94a3b8;
}
.gps-dot.ok      { background: var(--success); }
.gps-dot.error   { background: var(--danger); }
.gps-dot.loading { background: var(--warning); animation: gps-pulse 1.2s ease-in-out infinite; }
@keyframes gps-pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.gps-acc { margin-left: auto; font-size: .75rem; color: var(--text-muted); white-space: nowrap; }

/* Punch buttons */
.punch-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
.punch-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: .375rem; padding: 1.5rem 1rem;
  border-radius: var(--r); border: 2px solid var(--border); background: var(--card);
  cursor: pointer; font-size: .9375rem; font-weight: 600; font-family: inherit;
  color: var(--text-muted); box-shadow: var(--shadow);
  transition: all .2s; user-select: none;
}
.punch-btn:not(:disabled):hover  { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.punch-btn:not(:disabled):active { transform: scale(.96); }
.punch-btn:disabled { opacity: .35; cursor: not-allowed; }
.punch-ico { font-size: 1.625rem; }

.punch-btn.entrada:not(:disabled) { border-color: var(--success); color: var(--success); background: #f0fdf4; }
.punch-btn.pausa:not(:disabled)   { border-color: var(--warning); color: var(--warning); background: #fffbeb; }
.punch-btn.retorno:not(:disabled) { border-color: var(--primary); color: var(--primary); background: #f0f9ff; }
.punch-btn.saida:not(:disabled)   { border-color: var(--danger);  color: var(--danger);  background: #fef2f2; }

.punch-feedback {
  padding: .875rem 1rem; border-radius: var(--r);
  font-weight: 600; text-align: center; font-size: .9375rem;
  animation: fadeUp .25s ease;
}
.punch-feedback.success { background: #f0fdf4; color: var(--success); border: 1.5px solid #bbf7d0; }
.punch-feedback.error   { background: #fef2f2; color: var(--danger);  border: 1.5px solid #fecaca; }
.punch-feedback.loading { background: var(--bg); color: var(--text-muted); border: 1.5px solid var(--border); }
@keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

/* Card */
.card { background: var(--card); border-radius: var(--r); padding: 1rem; box-shadow: var(--shadow); }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: .75rem; }
.card-title  { font-size: 1rem; font-weight: 700; }

/* Record list */
.record-list { display: flex; flex-direction: column; gap: .5rem; }
.record-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: .625rem .75rem; background: var(--bg); border-radius: var(--r-sm);
}
.record-type { font-weight: 700; font-size: .875rem; }
.record-type.entrada { color: var(--success); }
.record-type.pausa   { color: var(--warning); }
.record-type.retorno { color: var(--primary); }
.record-type.saída   { color: var(--danger); }
.record-meta { font-size: .75rem; color: var(--text-muted); margin-top: .125rem; }
.record-time { font-size: .875rem; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.empty { text-align: center; color: var(--text-muted); font-size: .875rem; padding: 1rem; }

/* ── Filter row ─────────────────────────────── */
.filter-row { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.filter-row.wrap { align-items: flex-end; }
.filter-row span { font-size: .875rem; color: var(--text-muted); }

/* ══ MODAL ══════════════════════════════════════ */
.modal { position: fixed; inset: 0; z-index: 200; display: flex; align-items: flex-end; }
@media (min-width:600px) { .modal { align-items: center; justify-content: center; } }
.modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.5); backdrop-filter: blur(3px); }
.modal-sheet {
  position: relative; background: var(--card);
  width: 100%; max-width: 540px; max-height: 92vh; overflow-y: auto;
  border-radius: var(--r) var(--r) 0 0; box-shadow: var(--shadow-lg);
  animation: slideUp .22s ease;
}
.modal-sheet.wide { max-width: 680px; }
@media (min-width:600px) { .modal-sheet { border-radius: var(--r); } }
@keyframes slideUp { from { transform:translateY(30px); opacity:0; } to { transform:none; opacity:1; } }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.125rem 1.25rem .875rem;
  border-bottom: 1px solid var(--border);
  font-weight: 700; font-size: 1.0625rem;
  position: sticky; top: 0; background: var(--card); z-index: 1;
}
.modal-x { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); line-height: 1; padding: .2rem .4rem; border-radius: 4px; }
.modal-x:hover { background: var(--border); }
.modal-body { padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
.modal-foot { display: flex; gap: .75rem; justify-content: flex-end; padding-top: .75rem; border-top: 1px solid var(--border); }

/* ══ ADMIN ══════════════════════════════════════ */
.admin-wrap { display: flex; min-height: calc(100vh - 56px); }

.sidebar {
  width: 200px; flex-shrink: 0; background: var(--card);
  border-right: 1px solid var(--border); padding: .875rem .625rem;
  display: flex; flex-direction: column; gap: .25rem;
}
@media (max-width:680px) {
  .admin-wrap { flex-direction: column; }
  .sidebar { width: 100%; flex-direction: row; padding: .5rem; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); }
}
.nav-btn {
  display: flex; align-items: center; gap: .5rem; padding: .6rem .75rem;
  border-radius: var(--r-sm); border: none; background: transparent;
  color: var(--text-muted); cursor: pointer; font-size: .875rem; font-weight: 500;
  font-family: inherit; text-align: left; transition: background .15s, color .15s; white-space: nowrap;
}
.nav-btn:hover  { background: var(--bg); color: var(--text); }
.nav-btn.active { background: var(--primary-light); color: var(--primary); font-weight: 700; }

.admin-main { flex: 1; padding: 1.5rem; overflow-x: auto; min-width: 0; }
.sec       { max-width: 920px; }
.sec.hidden { display: none; }
.sec-head  { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
.sec-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 1rem; letter-spacing: -.02em; }

/* Stats */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 1rem; }
.stat {
  background: var(--card); border-radius: var(--r);
  padding: 1.25rem; box-shadow: var(--shadow); border: 1.5px solid var(--border);
}
.stat-val { font-size: 2.25rem; font-weight: 800; color: var(--primary); line-height: 1; font-variant-numeric: tabular-nums; }
.stat-lbl { font-size: .8125rem; color: var(--text-muted); margin-top: .375rem; }

/* Table */
.table-wrap { overflow-x: auto; border-radius: var(--r); box-shadow: var(--shadow); }
.dtable { width: 100%; border-collapse: collapse; background: var(--card); }
.dtable th {
  background: #f1f5f9; padding: .75rem 1rem; text-align: left;
  font-size: .75rem; font-weight: 700; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .06em; white-space: nowrap;
}
.dtable td { padding: .875rem 1rem; border-top: 1px solid var(--border); font-size: .875rem; vertical-align: middle; }
.dtable tr:hover td { background: #fafbfc; }

/* Badges */
.badge {
  display: inline-flex; align-items: center; padding: .2rem .625rem;
  border-radius: 999px; font-size: .75rem; font-weight: 700;
}
.bg-green { background: #dcfce7; color: #16a34a; }
.bg-red   { background: #fee2e2; color: #dc2626; }
.bg-blue  { background: #dbeafe; color: #2563eb; }
.bg-gray  { background: #f1f5f9; color: #64748b; }
.bg-entrada { background: #dcfce7; color: #16a34a; }
.bg-pausa   { background: #fef3c7; color: #d97706; }
.bg-retorno { background: #dbeafe; color: #2563eb; }
.bg-saída   { background: #fee2e2; color: #dc2626; }

/* Action buttons */
.act-row { display: flex; gap: .4rem; flex-wrap: wrap; }

/* Settings card */
.settings-card { max-width: 520px; display: flex; flex-direction: column; gap: 1.25rem; }

/* Chip grid (locais checkboxes) */
.chip-grid { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .375rem; }
.chip-item {
  display: flex; align-items: center; gap: .375rem;
  padding: .375rem .7rem; border: 1.5px solid var(--border);
  border-radius: var(--r-sm); cursor: pointer; font-size: .875rem;
  transition: border-color .15s, background .15s;
}
.chip-item:has(input:checked) { border-color: var(--primary); background: var(--primary-light); }
.chip-item input { accent-color: var(--primary); }

/* Filter card */
.filter-card { background: var(--card); border-radius: var(--r); padding: 1rem; box-shadow: var(--shadow); margin-bottom: 1rem; }
.fg { display: flex; flex-direction: column; gap: .25rem; min-width: 130px; }
.fg label { font-size: .8125rem; font-weight: 600; color: var(--text-muted); }

/* Map hint */
.map-hint { font-size: .8125rem; color: var(--text-muted); padding: .375rem 0; }

/* Toast */
.toast {
  position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
  background: #1e293b; color: #fff; padding: .75rem 1.5rem;
  border-radius: 999px; font-size: .9rem; font-weight: 500;
  box-shadow: var(--shadow-lg); z-index: 500;
  animation: toastIn .2s ease;
}
@keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(12px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
</style>
